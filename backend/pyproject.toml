[project]
name = "news-api"
version = "0.1.0"
description = "Public API for news.josan.ai: items, comments, votes, search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.16.10",
]
