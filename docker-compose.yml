services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news-backend
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - news_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        design: ./josanai-design
    container_name: news-frontend
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  news_data:
